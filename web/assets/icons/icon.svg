<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <!-- octagon -->
    <polygon points="0,-196 138.6,-138.6 196,0 138.6,138.6 0,196 -138.6,138.6 -196,0 -138.6,-138.6"
             fill="none" stroke="#e50914" stroke-width="14" filter="url(#glow)"/>
    <polygon points="0,-158 111.7,-111.7 158,0 111.7,111.7 0,158 -111.7,111.7 -158,0 -111.7,-111.7"
             fill="none" stroke="#e50914" stroke-width="4" opacity="0.55"/>
    <text x="0" y="-18" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
          font-size="118" fill="#FFD700">MMA</text>
    <text x="0" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700"
          font-size="40" letter-spacing="10" fill="#f5f5f5">MAJESTY</text>
  </g>
</svg>
