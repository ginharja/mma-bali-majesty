# Function Compute (nginx environment) — static host for mma majesty BALI
# Platform fixed constraints: daemon off, user root, listen 9000, root /code,
# all pid/log/temp paths under /tmp (read-only FS elsewhere).
user root;
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    server {
        listen 9000;
        server_name _;
        root /code;
        index index.html index.htm;

        # PWA service worker must never be cached by the browser
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
